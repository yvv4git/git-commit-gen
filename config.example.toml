[log]
level = "info"

[generator]
baseBranch = "main"
rulesFile = "rules.md"
maxDiffBytes = 262144
maxRulesBytes = 32768
maxContextBytes = 524288
maxAgentTurns = 12
maxToolCallsPerTurn = 8

[[llms]]
name = "default"
type = "open-ai"
# Per-attempt LLM request timeout. Defaults to 90s.
requestTimeout = "90s"

[llms.proxy]
enable = false
type = "socks5"
addr = "localhost:1080"
login = ""
passw = ""

[llms.openai]
# The API URL is set only here, not in .env.
api = "https://api.openai.com/v1"
token = ""
model = "gpt-4o"
# Allow plaintext http:// for a non-local API. Keep false unless you trust the network.
allowInsecureHttp = false

[llms.retry]
retries = 3
initInterval = "500ms"
maxInterval = "10s"

# Add more providers by repeating the block with a unique name:
# [[llms]]
# name = "secondary"
# type = "open-ai"
# ...

# OpenRouter free tier. The model must support tool calling.
# The free router picks an available free model automatically.
# [[llms]]
# name = "openrouter"
# type = "open-ai"
#
# [llms.proxy]
# enable = false
# type = "socks5"
# addr = "localhost:1080"
